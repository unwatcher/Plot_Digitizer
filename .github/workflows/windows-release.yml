name: Build and publish Windows packages

on:
  push:
    branches: [codex/windows-release-packages]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt
      - name: Test source and installer failure handling
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Download exact offline wheel closure
        run: >-
          python -m pip download --only-binary=:all: --require-hashes
          -r release/windows/requirements-offline.txt --dest .cache/wheelhouse
      - name: Build and verify both actual ZIPs
        run: python scripts/build_windows_release.py --wheelhouse .cache/wheelhouse --source-revision $env:GITHUB_SHA --repository $env:GITHUB_REPOSITORY
      - name: Publish verified preview release
        run: python scripts/publish_windows_release.py --repository $env:GITHUB_REPOSITORY --source-revision $env:GITHUB_SHA
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
